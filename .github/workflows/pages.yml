name: Deploy autumn dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "native/ui/app.slint"
      - "native/src/domain.rs"
      - "native/src/views.rs"
      - "native/src/note_links.rs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: autumn-dashboard-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install Pages dependencies
        run: npm ci
        working-directory: web
      - name: Test D1 API
        run: npm test
        working-directory: web
      - name: Build Slint web app
        run: npm run build
        working-directory: web
      - name: Create resources, migrate D1, and deploy Pages
        run: npm run deploy
        working-directory: web
