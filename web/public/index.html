<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秋招看板</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; font-family: system-ui, sans-serif; background: #f7f8fa; }
    #canvas { display: none; width: 100%; height: 100%; }
    #login { max-width: 380px; margin: 15vh auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 8px 30px #17223b18; }
    label { display: block; margin: 18px 0 8px; }
    input, button { box-sizing: border-box; width: 100%; height: 42px; border-radius: 7px; font: inherit; }
    input { border: 1px solid #ccd3df; padding: 0 12px; }
    button { border: 0; background: #2855d9; color: white; margin-top: 18px; cursor: pointer; }
    #message { color: #bf2d3d; min-height: 1.3em; }
  </style>
</head>
<body>
  <form id="login">
    <h1>秋招看板</h1>
    <p>请输入云端访问口令。</p>
    <label for="token">访问口令</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button type="submit">打开看板</button>
    <p id="message" role="alert"></p>
  </form>
  <canvas id="canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
