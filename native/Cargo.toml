[package]
name = "autumn-native"
version = "2.0.4"
edition = "2021"
publish = false
description = "Native cross-platform recruitment dashboard preview"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
tempfile = "3"
fs2 = "0.4"
open = "5"
# Trial upstream commit with the Windows repaint fix from slint-ui/slint#13568.
slint = { git = "https://github.com/slint-ui/slint", rev = "08a297b7151e52b98b500b4424a8dee770fc7b58", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "system-tray"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "08a297b7151e52b98b500b4424a8dee770fc7b58" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
