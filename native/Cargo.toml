[package]
name = "autumn-native"
version = "2.0.1"
edition = "2021"
publish = false
description = "Native cross-platform recruitment dashboard preview"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
tempfile = "3"
fs2 = "0.4"
open = "5"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "system-tray"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
